# Karton integration and development playground
include:
  - compose/compose.silo.yml
services:
  mwdb:
    environment:
      MWDB_ENABLE_KARTON: 1
    depends_on:
      karton-system-router:
        condition: service_started
    volumes:
      - "./dev/karton-service.ini:/etc/karton/karton.ini"
  karton-system-router:
    image: certpl/karton-system:v6.1.0
    depends_on:
      silo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - "./dev/karton-system.ini:/etc/karton/karton.ini"
    entrypoint: karton-system
    command: --setup-bucket --disable-gc
  karton-system-gc:
    image: certpl/karton-system:v6.1.0
    depends_on:
      karton-system-router:
        condition: service_started
    volumes:
      - "./dev/karton-system.ini:/etc/karton/karton.ini"
    entrypoint: karton-system
    command: --disable-router
  karton-gateway:
    image: certpl/karton-gateway:v6.1.0
    depends_on:
      karton-system-router:
        condition: service_started
    volumes:
      - "./dev/karton-system.ini:/etc/karton/karton.ini"
  karton-classifier:
    image: certpl/karton-classifier:d02095771ce85394c3c533df48da4ea4ccf30f78
    depends_on:
      silo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - "./dev/karton-service.ini:/etc/karton/karton.ini"
  karton-dashboard:
    image: certpl/karton-dashboard:v1.6.0
    depends_on:
      silo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Change this to karton-service.ini after Karton v6 version
      # is applied for dashboard
      - "./dev/karton-system.ini:/etc/karton/karton.ini"
    ports:
      - "127.0.0.1:8030:5000"
  karton-mwdb-reporter:
    image: certpl/karton-mwdb-reporter:72f51198ffc93a2144eeb16cb2dc3a2f76fe6c98
    depends_on:
      silo:
        condition: service_healthy
      redis:
        condition: service_healthy
      mwdb:
        condition: service_healthy
      mwdb-web:
        condition: service_healthy
    volumes:
      - "./dev/karton-service.ini:/etc/karton/karton.ini"
    env_file:
      - mwdb-vars.env
